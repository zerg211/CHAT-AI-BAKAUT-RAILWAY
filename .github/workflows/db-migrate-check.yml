name: DB migrate check (pg16)

on:
  push:
    paths:
      - 'sql/**'
      - 'src/db/migrate.ts'
      - '.github/workflows/db-migrate-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chat_ai
          POSTGRES_PASSWORD: chat_ai
          POSTGRES_DB: chat_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://chat_ai:chat_ai@localhost:5432/chat_ai
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: |
          set +e
          npm ci --no-audit --no-fund > npm-ci.log 2>&1
          code=$?
          echo "exit=$code" >> npm-ci.log
          tail -n 40 npm-ci.log || true
          exit $code

      - name: Publish failure details to step summary
        if: failure()
        run: |
          {
            echo "### npm ci output"
            '```'
            tail -n 40 npm-ci.log 2>/dev/null || true
            '```'
            echo "### Migrate output"
            '```'
            cat migrate.log 2>/dev/null || true
            '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit debug logs to ci-debug branch
        if: failure()
        run: |
          git config user.email "ci@bot.local"
          git config user.name "ci-bot"
          git fetch origin ci-debug || git branch ci-debug
          git checkout ci-debug || git checkout -b ci-debug
          mkdir -p debug
          [ -f npm-ci.log ] && cp -f npm-ci.log debug/ || echo "no npm-ci.log" > debug/npm-ci.missing
          [ -f migrate.log ] && cp -f migrate.log debug/ || echo "no migrate.log" > debug/migrate.missing
          git add -A debug
          git commit -m "ci debug logs ($GITHUB_SHA)" || true
          git push origin ci-debug
